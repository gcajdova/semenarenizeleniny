<VirtualHost *:80>
    ServerName seminka.example.cz
    DocumentRoot /var/www/seminka/public

    <Directory /var/www/seminka/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/seminka-error.log
    CustomLog ${APACHE_LOG_DIR}/seminka-access.log combined
</VirtualHost>
